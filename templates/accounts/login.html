<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone - Login</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #e9edef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {

            width: 380px;

            max-width: 92%;

            background: #ffffff;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.12);
        }

        .logo {

            text-align: center;

            margin-bottom: 12px;
        }


        .logo-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto;

            border-radius: 50%;

            background: #25d366;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 34px;

            font-weight: bold;

            box-shadow:
                0 5px 15px
                rgba(37, 211, 102, 0.25);
        }

        h1 {

            text-align: center;

            margin-top: 15px;

            color: #111b21;

            font-size: 26px;

            font-weight: 600;
        }

        .subtitle {

            text-align: center;

            color: #667781;

            margin-top: 8px;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .error {

            background: #ffe5e5;

            color: #c62828;

            padding: 11px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;

            text-align: center;
        }

        .form-group {

            margin-bottom: 18px;
        }
        label {

            display: block;

            margin-bottom: 7px;

            color: #111b21;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d7db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            color: #111b21;

            background: #ffffff;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input::placeholder {

            color: #8696a0;
        }


        input:focus {

            border-color: #25d366;

            box-shadow:
                0 0 0 2px
                rgba(37, 211, 102, 0.12);
        }

        .login-button {

            width: 100%;

            border: none;

            padding: 13px;

            border-radius: 7px;

            background: #25d366;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        .login-button:hover {

            background: #20bd5a;
        }


        .login-button:active {

            transform: scale(0.98);
        }

        .login-footer {

            text-align: center;

            margin-top: 22px;

            color: #8696a0;

            font-size: 12px;
        }

        @media (max-width: 450px) {

            .login-container {

                padding: 28px 22px;
            }

            h1 {

                font-size: 23px;
            }

            .logo-icon {

                width: 62px;

                height: 62px;

                font-size: 30px;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">
                ☎
            </div>

        </div>

        <h1>
            WhatsApp Clone
        </h1>

        <p class="subtitle">
            Login to continue
        </p>

        {% if form.errors %}

            <div class="error">

                Invalid username or password.

            </div>

        {% endif %}

        <form
            method="POST"
            action=""
        >

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                    autofocus
                ></div>

            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>
            <button
                type="submit"
                class="login-button"
            >

                Login

            </button>

        </form>

        <div class="login-footer">

            WhatsApp Clone &copy; 2026

        </div>

    </div>


</body>

</html>
